<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>관상 수사대: 롬브로소의 몽타주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--paper:#efebe2;--paper2:#e6e0d3;--ink:#232220;--muted:#6d685e;--red:#b3261e;--blue:#1f4e8c;--line:#cfc7b6;--card:#f7f4ee;--green:#2e7d32}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px),radial-gradient(rgba(0,0,0,.025) 1px,transparent 1px);
    background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
  .wrap{max-width:820px;margin:0 auto;padding:22px 16px 60px}
  body.host .wrap{max-width:1180px}
  .mono{font-family:'Nanum Gothic Coding',monospace}
  .tag{display:inline-block;font-family:'Nanum Gothic Coding',monospace;font-size:13px;letter-spacing:.06em;border:1.5px solid var(--ink);padding:3px 9px;border-radius:2px;white-space:nowrap}
  .tag.red{border-color:var(--red);color:var(--red);font-weight:700}
  h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(36px,8vw,58px);line-height:1.05;margin:12px 0 6px}
  h1 em{font-style:normal;color:var(--red)}
  h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(24px,5vw,34px);margin:6px 0 10px;line-height:1.2}
  .sub{color:var(--muted);font-size:15px;line-height:1.6}
  .panel{background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:18px;margin:16px 0}
  label.f{display:block;font-family:'Nanum Gothic Coding',monospace;font-size:13px;font-weight:700;margin:10px 0 5px}
  input.in{width:100%;font:inherit;font-size:20px;padding:12px;border:2px solid var(--ink);background:#fff;border-radius:2px;color:var(--ink)}
  input.in.code{font-family:'Nanum Gothic Coding',monospace;font-weight:700;letter-spacing:.3em;text-align:center;font-size:28px}
  input.in:focus{outline:3px solid rgba(179,38,30,.35);outline-offset:2px}
  .btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;font-weight:700;font-size:18px;padding:14px 22px;cursor:pointer;border-radius:2px}
  .btn:active{transform:translateY(2px)}
  .btn[disabled]{opacity:.35;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.red{background:var(--red);border-color:var(--red)}
  .btn.block{width:100%;margin-top:14px}
  .linkbtn{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
  .err{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin-top:8px}
  .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .center{text-align:center}
  .hidden{display:none!important}

  .checklist ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px}
  .checklist li{font-size:15px;padding-left:22px;position:relative}
  .checklist li::before{content:"☐";position:absolute;left:0;top:-1px}

  /* 진행자 로비 */
  .lobby{display:grid;grid-template-columns:minmax(260px,1fr) 1.3fr;gap:20px;align-items:start}
  .bigcode{font-family:'Nanum Gothic Coding',monospace;font-weight:700;font-size:clamp(56px,10vw,96px);letter-spacing:.12em;line-height:1;margin:6px 0 10px}
  .qr{background:var(--card);padding:10px;display:inline-block;border:2px solid var(--ink)}
  .qr img,.qr canvas{display:block}
  .url{font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:var(--muted);word-break:break-all;margin-top:8px}
  .plist{list-style:none;display:grid;gap:8px;margin:10px 0}
  .plist li{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);background:#fff;padding:10px 12px;font-weight:700;font-size:18px}
  .plist li.empty{border-style:dashed;color:var(--muted);font-weight:400;font-size:15px;background:transparent}
  .dot{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid var(--ink)}
  .plist .x{margin-left:auto}
  .script{border-left:4px solid var(--red);background:rgba(179,38,30,.06);padding:10px 14px;font-size:15px;line-height:1.6;margin:14px 0}
  .script b{color:var(--red);font-family:'Nanum Gothic Coding',monospace;font-size:12px;display:block;letter-spacing:.06em}
  table.mini{width:100%;border-collapse:collapse;font-size:14px}
  table.mini td{padding:5px 4px;border-bottom:1px solid var(--line)}
  .stats{display:flex;gap:18px;flex-wrap:wrap}
  .stats div{font-size:13px;color:var(--muted)}
  .stats b{display:block;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:28px;color:var(--ink)}

  /* 라운드 */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .me{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
  .q{font-size:clamp(19px,4.4vw,28px);font-weight:900;margin:6px 0 12px;line-height:1.35}
  .q small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:3px}
  .timer{font-family:'Black Han Sans',sans-serif;font-size:30px;min-width:64px;text-align:center;border:2px solid var(--ink);padding:2px 10px;background:var(--card)}
  .timer.low{color:var(--red);border-color:var(--red)}
  body.host .timer{font-size:46px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  body.host .pair{gap:22px;max-width:600px;margin:0 auto}
  .card{background:var(--card);border:2px solid var(--ink);position:relative;text-align:left;font:inherit;color:inherit;padding:0;box-shadow:4px 4px 0 var(--ink);overflow:hidden;display:block;width:100%}
  button.card{cursor:pointer}
  button.card[disabled]{cursor:default}
  .card.sel{outline:4px solid var(--red);outline-offset:3px}
  .card .lbl{display:flex;justify-content:space-between;padding:7px 9px;border-bottom:1.5px solid var(--ink);font-family:'Nanum Gothic Coding',monospace;font-size:13px;font-weight:700;background:var(--paper2)}
  .card .lbl .big{font-size:16px}
  .card svg{display:block;width:100%;height:auto}
  .reveal{padding:9px 11px 11px;border-top:1.5px solid var(--ink)}
  .crime{font-size:12px;color:var(--muted)}
  .verdict{font-weight:900;font-size:clamp(15px,3.6vw,20px);white-space:pre-line;line-height:1.25;margin:2px 0 6px}
  .verdict.free{color:var(--blue)} .verdict.guilty{color:var(--red)}
  .lmb{font-family:'Nanum Gothic Coding',monospace;font-size:11px;color:var(--muted)}
  .meter{height:6px;border:1.2px solid var(--ink);margin-top:3px;background:#fff}
  .meter span{display:block;height:100%;background:var(--ink)}
  .stamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font-family:'Black Han Sans',sans-serif;font-size:clamp(20px,5.5vw,36px);
    padding:3px 10px;border:4px solid currentColor;border-radius:6px;white-space:nowrap;pointer-events:none;background:rgba(247,244,238,.75);opacity:.93;animation:stamp .3s cubic-bezier(.2,1.6,.4,1)}
  @keyframes stamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(1.8);opacity:0}}
  .stamp.free{color:var(--blue)} .stamp.guilty{color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;min-height:22px}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:20px;color:#fff}
  .bets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .bet{border:2px solid var(--ink);background:#fff;font:inherit;font-weight:900;font-size:18px;padding:10px 0;cursor:pointer;border-radius:2px}
  .bet small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
  .bet.on{background:var(--ink);color:var(--paper)} .bet.on small{color:var(--paper)}
  .wait{margin-top:14px;padding:14px;border:2px dashed var(--ink);text-align:center;font-weight:700;line-height:1.6}
  .status{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 4px}
  .status span{border:2px solid var(--ink);padding:6px 12px;font-weight:700;background:#fff;font-size:16px;display:flex;align-items:center;gap:6px}
  .status span.done{background:var(--ink);color:var(--paper)}
  .banner{text-align:center;font-size:clamp(22px,6vw,32px);font-weight:900;margin:12px 0 4px}
  .banner .ok{color:var(--blue)} .banner .no{color:var(--red)} .banner .na{color:var(--muted)}
  .board{list-style:none;margin:12px 0;display:grid;gap:6px}
  .board li{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--ink);padding:9px 12px;font-weight:700}
  .board .rk{font-family:'Black Han Sans',sans-serif;font-weight:400;width:26px;font-size:20px}
  .board .sc{margin-left:auto;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:22px}
  .board .d{font-size:13px;width:38px;text-align:right}
  .board .d.p{color:var(--blue)} .board .d.m{color:var(--red)}
  .board li.win{background:#fff6d6}
  .board .sub2{font-size:12px;color:var(--muted);font-weight:400}
  body.host .board li{font-size:22px;padding:12px 16px}
  .secret{background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:16px 18px;margin:14px 0;animation:pop .35s ease-out}
  .secret .no{font-family:'Nanum Gothic Coding',monospace;font-size:13px;color:var(--red);font-weight:700}
  .secret p{font-size:18px;line-height:1.65;margin-top:5px}
  .secret p b{color:var(--red)}
  body.host .secret p{font-size:24px}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .history{border-left:4px solid var(--ink);padding:4px 0 4px 16px;margin:22px 0;font-size:16px;line-height:1.75}
  .law{background:var(--ink);color:var(--paper);padding:24px 20px;margin:22px 0;text-align:center}
  .law .art{font-family:'Nanum Gothic Coding',monospace;font-size:13px;opacity:.75}
  .law blockquote{font-family:'Black Han Sans',sans-serif;font-size:clamp(22px,5.4vw,34px);line-height:1.35;margin:10px 0 12px}
  .law p{font-size:16px;line-height:1.7;opacity:.92}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;font-weight:700;border-radius:3px;z-index:9;max-width:90vw;text-align:center}
  .warnbox{border:2px solid var(--red);color:var(--red);padding:10px;font-size:14px;margin:10px 0;font-weight:700}
  @media (max-width:760px){ .lobby{grid-template-columns:1fr} }
  @media (max-width:520px){ .wrap{padding:16px 10px 50px} .checklist ul{grid-template-columns:1fr} .pair{gap:8px} .card .lbl{font-size:11px;padding:5px 6px} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
  </filter>
  <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="#000" stroke-width="1.1" opacity=".35"/>
  </pattern>
</defs></svg>
<div class="wrap" id="app"></div>
<div class="toast hidden" id="toast"></div>

<script>
const APP_URL   = <?!= JSON.stringify(appUrl) ?>;
const INIT_CODE = <?!= JSON.stringify(initCode) ?>;
const HOST_MODE = <?!= JSON.stringify(hostMode) ?>;
</script>
<script>
(function(){
/* ================= 공통 ================= */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = (fn,...args) => new Promise((res,rej)=>{
  google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...args);
});
const errMsg = e => String((e && e.message) || e).replace(/^Error:\s*/,"").replace(/^Exception:\s*/,"");
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.remove("hidden"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add("hidden"),3200); }
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ================= 몽타주 생성 (시드 고정 → 모든 기기에서 같은 얼굴) ================= */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function faceParams(seed, r, k, high){
  const rng = mulberry32((seed ^ (r*7919 + k*104729 + 17)) >>> 0);
  const rr = () => high ? 0.58 + rng()*0.42 : rng()*0.38;
  const p = { jaw:rr(), ridge:rr(), asym:rr(), ears:rr(), forehead:rr(), brow:rr(), eyes:rr(), lips:rr(),
    hair:Math.floor(rng()*4), noseW:rng(), mouthW:rng(), faceW:rng(), stubble:rng()<0.35, glasses:rng()<0.15 };
  p.rng = rng; return p;
}
const lombroso = p => Math.round((p.jaw+p.ridge+p.asym+p.ears+p.forehead+p.brow+p.eyes+p.lips)/8*100);
const faceCache = {};
function faceSVG(seed, r, k, high, age){
  const key = seed+":"+r+":"+k;
  if(faceCache[key]) return faceCache[key];
  const p = faceParams(seed,r,k,high), R = p.rng, rnd=(a,b)=>a+R()*(b-a);
  const cx=100, a=p.asym*7, ag=(age-22)/41;
  const fh=44+p.faceW*6, jh=26+p.jaw*20, jawY=166+p.jaw*10, chinY=204+p.jaw*6, chh=7+p.jaw*15, topY=36;
  const hairY=52+p.forehead*26, eyeY=116, browY=96+p.ridge*8;
  const exL=cx-20, exR=cx+20+a*0.4, eyR=eyeY-a*0.7;
  const erx=8.5-p.eyes*4, ery=3.8-p.eyes*1.4, earH=21+p.ears*17, earW=8+p.ears*10;
  const noseY=148+p.jaw*2, nw=7+p.noseW*6, mY=172+p.jaw*4, mw=13+p.mouthW*8;
  const S='stroke="#232220" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  let s=`<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">`;
  for(let y=20;y<240;y+=20) s+=`<line x1="0" x2="200" y1="${y}" y2="${y}" stroke="#232220" stroke-width=".6" opacity=".12"/>`;
  s+=`<g filter="url(#pencil)">`;
  s+=`<path d="M6 240 Q14 212 ${cx-27} 208 L ${cx-22} 186 L ${cx+22} 186 L ${cx+27} 208 Q186 212 194 240 Z" fill="#e2ddd2" stroke="#232220" stroke-width="1.8" stroke-linejoin="round"/>`;
  s+=`<path d="M${cx-27} 208 L ${cx} 230 L ${cx+27} 208" ${S} stroke-width="1.4"/>`;
  const earL=cx-fh-earW*0.3, earR=cx+fh+a+earW*0.3;
  s+=`<ellipse cx="${earL}" cy="118" rx="${earW*0.62}" ry="${earH*0.5}" fill="#f1ece2" stroke="#232220" stroke-width="1.8"/>`;
  s+=`<ellipse cx="${earR}" cy="${118-a*0.5}" rx="${earW*0.62}" ry="${earH*0.5}" fill="#f1ece2" stroke="#232220" stroke-width="1.8"/>`;
  s+=`<path d="M${earL+earW*0.15} ${118-earH*0.28} Q${earL-earW*0.3} 118 ${earL+earW*0.1} ${118+earH*0.25}" ${S} stroke-width="1.1" opacity=".6"/>`;
  s+=`<path d="M${earR-earW*0.15} ${118-a*0.5-earH*0.28} Q${earR+earW*0.3} ${118-a*0.5} ${earR-earW*0.1} ${118-a*0.5+earH*0.25}" ${S} stroke-width="1.1" opacity=".6"/>`;
  const Rt=cx+fh+a, L=cx-fh;
  s+=`<path d="M${cx} ${topY} C${cx+32} ${topY} ${Rt} 52 ${Rt} 104 C${Rt} 138 ${cx+jh+a} ${jawY-12} ${cx+jh+a*0.6} ${jawY}
    Q${cx+jh*0.75+a*0.4} ${chinY-2} ${cx+chh} ${chinY} L${cx-chh} ${chinY} Q${cx-jh*0.75} ${chinY-2} ${cx-jh} ${jawY}
    C${cx-jh} ${jawY-12} ${L} 138 ${L} 104 C${L} 52 ${cx-32} ${topY} ${cx} ${topY} Z" fill="#f4f0e7" stroke="#232220" stroke-width="2"/>`;
  s+=`<path d="M${cx-jh+4} ${jawY+2} Q${cx} ${chinY+4} ${cx+jh+a*0.6-4} ${jawY+2} L${cx+chh} ${chinY-1} L${cx-chh} ${chinY-1} Z" fill="url(#hatch)" opacity="${0.15+p.jaw*0.5}"/>`;
  const capTop=topY-14;
  const cap=`M${L-1} ${hairY+12} C${L-7} ${capTop} ${Rt+7} ${capTop} ${Rt+1} ${hairY+12} Q${cx+fh*0.5} ${hairY-4} ${cx} ${hairY} Q${cx-fh*0.5} ${hairY-4} ${L-1} ${hairY+12} Z`;
  if(p.hair===0) s+=`<path d="${cap}" fill="#3b3a37" stroke="#232220" stroke-width="1.6"/><path d="${cap}" fill="url(#hatch)"/>`;
  else if(p.hair===1) s+=`<path d="${cap}" fill="#77736b" stroke="#232220" stroke-width="1.6"/><path d="${cap}" fill="url(#hatch)" opacity=".6"/><path d="M${cx-14} ${hairY-2} Q${cx-18} ${topY+4} ${cx-10} ${topY-4}" ${S} stroke-width="1.4"/>`;
  else if(p.hair===2){ s+=`<path d="${cap}" fill="#4a4844" stroke="#232220" stroke-width="1.4"/>`;
    for(let i=0;i<=12;i++){ const t=i/12, x=L+t*(Rt-L), y=hairY+8-Math.sin(t*Math.PI)*(hairY-capTop-6);
      s+=`<circle cx="${x}" cy="${y}" r="${5+R()*2}" fill="#4a4844" stroke="#232220" stroke-width="1.2"/>`; } }
  else { s+=`<path d="${cap}" fill="#a39e94" stroke="#232220" stroke-width="1.4" opacity=".85"/>`;
    for(let i=0;i<70;i++){ const t=R(), x=L+t*(Rt-L), y=hairY+6-R()*Math.sin(t*Math.PI)*(hairY-capTop-4);
      s+=`<circle cx="${x}" cy="${y}" r=".8" fill="#232220" opacity=".6"/>`; } }
  if(ag>0.55 && browY-hairY>18){ const y=(hairY+browY)/2;
    s+=`<path d="M${cx-18} ${y} Q${cx} ${y-3} ${cx+18} ${y}" ${S} stroke-width="1" opacity=".45"/><path d="M${cx-13} ${y+6} Q${cx} ${y+3} ${cx+13} ${y+6}" ${S} stroke-width="1" opacity=".35"/>`; }
  s+=`<ellipse cx="${exL}" cy="${browY+5}" rx="15" ry="${3+p.ridge*4}" fill="#000" opacity="${0.04+p.ridge*0.2}"/>`;
  s+=`<ellipse cx="${exR}" cy="${browY+5-a*0.7}" rx="15" ry="${3+p.ridge*4}" fill="#000" opacity="${0.04+p.ridge*0.2}"/>`;
  s+=`<path d="M${exL-16} ${browY+7} Q${cx} ${browY+1} ${exR+16} ${browY+7-a*0.7}" ${S} stroke-width="1.1" opacity="${p.ridge*0.6}"/>`;
  const bw=1.8+p.brow*5;
  s+=`<path d="M${exL-14} ${browY+2} Q${exL-2} ${browY-3} ${exL+12} ${browY}" ${S} stroke-width="${bw}"/>`;
  s+=`<path d="M${exR-12} ${browY-a*0.7} Q${exR+2} ${browY-3-a*0.7} ${exR+14} ${browY+2-a*0.7}" ${S} stroke-width="${bw}"/>`;
  if(p.brow>0.8) s+=`<path d="M${exL+12} ${browY} Q${cx} ${browY+1.5} ${exR-12} ${browY-a*0.7}" ${S} stroke-width="${bw*0.55}"/>`;
  [[exL,eyeY],[exR,eyR]].forEach(([x,y])=>{
    s+=`<ellipse cx="${x}" cy="${y}" rx="${erx}" ry="${ery}" fill="#fff" stroke="#232220" stroke-width="1.3"/><circle cx="${x}" cy="${y}" r="${ery*0.85}" fill="#232220"/>`;
    s+=`<path d="M${x-erx-1.5} ${y} Q${x} ${y-ery*2.3} ${x+erx+1.5} ${y}" ${S} stroke-width="1.8"/>`;
    if(ag>0.5) s+=`<path d="M${x-erx+1} ${y+ery+3} Q${x} ${y+ery+6} ${x+erx-1} ${y+ery+3}" ${S} stroke-width=".9" opacity=".45"/>`;
  });
  if(p.glasses){
    s+=`<circle cx="${exL}" cy="${eyeY}" r="13" ${S} stroke-width="1.6"/><circle cx="${exR}" cy="${eyR}" r="13" ${S} stroke-width="1.6"/>`;
    s+=`<path d="M${exL+13} ${eyeY-1} Q${cx} ${eyeY-5} ${exR-13} ${eyR-1}" ${S} stroke-width="1.4"/><path d="M${exL-13} ${eyeY-2} L${L+1} ${eyeY-4}" ${S} stroke-width="1.4"/><path d="M${exR+13} ${eyR-2} L${Rt-1} ${eyR-4}" ${S} stroke-width="1.4"/>`;
  }
  s+=`<path d="M${cx-1} ${eyeY+4} Q${cx-5} ${eyeY+22} ${cx-nw} ${noseY}" ${S} stroke-width="1.4"/>`;
  s+=`<path d="M${cx-nw} ${noseY} Q${cx-nw*0.6} ${noseY+5} ${cx} ${noseY+3} Q${cx+nw*0.6} ${noseY+5} ${cx+nw} ${noseY}" ${S} stroke-width="1.5"/>`;
  s+=`<ellipse cx="${cx-nw*0.45}" cy="${noseY+1.5}" rx="2" ry="1.2" fill="#232220" opacity=".55"/><ellipse cx="${cx+nw*0.45}" cy="${noseY+1.5}" rx="2" ry="1.2" fill="#232220" opacity=".55"/>`;
  if(ag>0.45){
    s+=`<path d="M${cx-nw-4} ${noseY-2} Q${cx-nw-9} ${mY-4} ${cx-mw-2} ${mY+5}" ${S} stroke-width="1" opacity=".45"/><path d="M${cx+nw+4} ${noseY-2} Q${cx+nw+9} ${mY-4} ${cx+mw+2} ${mY+5}" ${S} stroke-width="1" opacity=".45"/>`;
  }
  const d=7-p.lips*5.5;
  if(p.lips<0.6) s+=`<path d="M${cx-mw*0.7} ${mY-1} Q${cx-4} ${mY-5+p.lips*3} ${cx} ${mY-3} Q${cx+4} ${mY-5+p.lips*3} ${cx+mw*0.7} ${mY-1}" ${S} stroke-width="1.1" opacity=".55"/>`;
  s+=`<path d="M${cx-mw} ${mY} Q${cx} ${mY+2} ${cx+mw} ${mY+a*0.35}" ${S} stroke-width="1.9"/>`;
  s+=`<path d="M${cx-mw*0.55} ${mY+3} Q${cx} ${mY+3+d} ${cx+mw*0.55} ${mY+3}" ${S} stroke-width="1.2" opacity=".7"/>`;
  if(p.stubble){
    for(let i=0;i<90;i++){ const y=rnd(mY-10,chinY-3), half=(y<jawY?jh:jh-(y-jawY)*(jh-chh)/(chinY-jawY))-5;
      const x=cx+rnd(-half,half); if(Math.abs(x-cx)<mw+2 && Math.abs(y-mY-2)<6) continue;
      s+=`<circle cx="${x}" cy="${y}" r=".7" fill="#232220" opacity=".5"/>`; }
  }
  s+=`</g></svg>`;
  return (faceCache[key] = {svg:s, l:lombroso(p)});
}

/* ================= 상태 ================= */
const S = { role:null, code:"", hostKey:"", pid:"", sid:"", name:"", gameNo:0,
  view:null, ver:0, offset:0, lastKey:"", sel:{key:"",c:null,b:1,sent:false}, revealSent:{}, polling:false, timer:null, gone:false };
const now = () => Date.now() + S.offset;
const LETTER = ["A","B"];

/* ================= 폴링 ================= */
let pollT=null, inFlight=false;
function startPolling(){ if(S.polling) return; S.polling=true; poll(); if(!S.timer) S.timer=setInterval(tick,250); }
function stopPolling(){ S.polling=false; clearTimeout(pollT); }
async function poll(force){
  if(!S.polling) return;
  clearTimeout(pollT);
  if(inFlight && !force){ pollT=setTimeout(poll,300); return; }
  inFlight=true;
  try{
    const res = await api("getState", S.code, S.pid||"", S.hostKey||"", force?0:S.ver);
    S.offset = res.now - Date.now();
    if(res.gone){ S.gone=true; render(); }
    else if(res.room){ S.view=res.room; S.ver=res.room.ver; S.gone=false; render(); }
  }catch(e){ /* 네트워크 오류는 다음 폴링에서 재시도 */ }
  inFlight=false;
  const ph = S.view && S.view.phase;
  pollT=setTimeout(poll, (ph==="pick"||ph==="reveal") ? 900 : 1500);
}
function tick(){
  const v=S.view; if(!v) return;
  const el=document.getElementById("timer");
  if(v.phase==="pick" && el){
    const left=Math.max(0,Math.ceil((v.deadline-now())/1000));
    el.textContent=left; el.classList.toggle("low",left<=5);
  }
  if(S.role==="host" && v.phase==="pick"){
    const k=v.gameNo+":"+v.round;
    const act = activePlayers(v);
    const allIn = act.length>0 && act.every(p=>p.submitted);
    if(!S.revealSent[k] && (allIn || now()>v.deadline+600)){
      S.revealSent[k]=true;
      api("reveal",S.code,S.hostKey).then(()=>poll(true)).catch(e=>{ S.revealSent[k]=false; toast(errMsg(e)); });
    }
  }
}
const activePlayers = v => v.sd ? v.players.filter(p=>v.sd.ids.includes(p.id)) : v.players;
async function hostAct(fn){
  try{ await api(fn,S.code,S.hostKey); poll(true); }catch(e){ toast(errMsg(e)); }
}

/* ================= 렌더링 ================= */
function render(){
  document.body.classList.toggle("host", S.role==="host");
  if(!S.role) return;                // 입장 화면은 별도
  if(S.gone){ app.innerHTML = goneScreen(); bindGone(); S.lastKey="gone"; return; }
  const v=S.view; if(!v) return;
  if(S.role==="player" && !v.me){ const k="out:"+v.gameNo; if(S.lastKey!==k){ S.lastKey=k; app.innerHTML=outScreen(v); bindOut(); } return; }
  const key=[v.phase,v.gameNo,v.round,v.secret,(v.sd?"sd":"")].join(":");
  if(key!==S.lastKey){ S.lastKey=key; build(v); window.scrollTo(0,0); }
  update(v);
}
function build(v){
  const H=S.role==="host";
  const fn = {lobby: H?hostLobby:playerLobby, pick: H?hostPick:playerPick, reveal: revealScreen,
              final: finalScreen, secret: secretScreen, ending: secretScreen}[v.phase];
  app.innerHTML = fn(v);
  bind(v);
}

/* ---- 공통 조각 ---- */
function meBar(v){
  if(S.role!=="player"||!v.me) return `<span class="tag">진행자 화면 · 코드 ${esc(v.code)}</span>`;
  const p=v.players.find(x=>x.id===v.me.id);
  return `<span class="me"><span class="dot" style="background:${v.me.color}"></span>${esc(v.me.name)} · <span id="myScore">${p?p.score:0}</span>점</span>`;
}
function roundTag(v){
  if(v.round>=v.rounds_main) return `<span class="tag red">서든데스 ${v.round-v.rounds_main+1}</span>`;
  return `<span class="tag">사건 파일 ${String(v.round+1).padStart(2,"0")} / ${String(v.rounds_main).padStart(2,"0")}</span>`;
}
function card(v, k, opts){
  const rd=v.rounds[v.round], f=faceSVG(v.seed,v.round,k,rd.hi===k,rd.ages[k]);
  const out = rd.out && rd.out[k];
  const tagName = opts.button ? "button" : "div";
  let h=`<${tagName} class="card${opts.sel?" sel":""}" data-k="${k}" ${opts.disabled?"disabled":""}>
    <div class="lbl"><span class="big">피고인 ${LETTER[k]}</span><span>${rd.ages[k]}세</span></div>${f.svg}`;
  if(out){
    const free=out.s===0;
    h+=`<div class="stamp ${free?"free":"guilty"}">${free?"무죄":esc(out.v.split("\n")[0])}</div>
      <div class="reveal"><div class="crime">${esc(out.c)}</div><div class="verdict ${free?"free":"guilty"}">${esc(out.v)}</div>
      <div class="lmb">롬브로소 지수 ${f.l}</div><div class="meter"><span style="width:${f.l}%"></span></div>
      <div class="chips">${v.players.filter(p=>p.picks[v.round] && p.picks[v.round].c===k)
        .map(p=>`<span class="chip" style="background:${p.color}">${esc(p.name)}${v.sd?"":" "+p.picks[v.round].b+"점"}</span>`).join("")}</div></div>`;
  }
  return h+`</${tagName}>`;
}
function board(v, opts){
  const r=v.round;
  const list=v.players.slice().sort((a,b)=>b.score-a.score);
  let rank=0, prev=null;
  return `<ul class="board">${list.map((p,i)=>{
    if(p.score!==prev){ rank=i+1; prev=p.score; }
    const d=p.deltas[r];
    const dTxt = opts && opts.delta && d!==undefined ? `<span class="d ${d>0?"p":d<0?"m":""}">${d>0?"+":""}${d}</span>` : "";
    return `<li><span class="rk">${rank}</span><span class="dot" style="background:${p.color}"></span>${esc(p.name)}<span class="sc">${p.score}</span>${dTxt}</li>`;
  }).join("")}</ul>`;
}
const SCRIPT = {

  secret:"비밀을 하나씩 소리 내어 읽어 주세요.",

};
const script = k => `<div class="script"><b>진행 멘트</b>${SCRIPT[k]}</div>`;

  <li>좁고 낮은 이마</li><li>짙고 이어진 눈썹</li><li>작은 눈</li><li>얇은 입술</li></ul></div>`;

/* ---- 참가자: 라운드 ---- */
function playerPick(v){
  const k=v.gameNo+":"+v.round;
  if(S.sel.key!==k) S.sel={key:k,c:null,b:1,sent:false};
  if(v.me.pick){ S.sel.sent=true; S.sel.c=v.me.pick.c; S.sel.b=v.me.pick.b; }
  const inSD = !v.sd || v.sd.ids.includes(v.me.id);
  let h=`<div class="topbar">${meBar(v)}${roundTag(v)}<div class="timer" id="timer">${Math.max(0,Math.ceil((v.deadline-now())/1000))}</div></div>`;

    return h+`<div class="pair">${card(v,0,{})}${card(v,1,{})}</div><div class="wait">동점자끼리 서든데스 중이에요. 함께 지켜봐 주세요!</div>`;
  }
  h+=`<div class="q">더 무거운 형을 받은 피고인은?<small>${v.sd?"서든데스! 맞히면 1점":"얼굴을 눌러 고르세요"}</small></div>
  <div class="pair" id="pair">${card(v,0,{button:true,sel:S.sel.c===0,disabled:S.sel.sent})}${card(v,1,{button:true,sel:S.sel.c===1,disabled:S.sel.sent})}</div>`;
  if(!v.sd) h+=`<div style="margin-top:14px"><b class="mono" style="font-size:13px">확신도 걸기</b><div class="bets" id="bets">

function playerPickFoot(v){

async function sendPick(){

  S.sel.sent=true; S.lastKey=""; render();
  try{ await api("submit",S.code,S.pid,v.round,S.sel.c,S.sel.b); poll(true); }
  catch(e){ S.sel.sent=false; S.lastKey=""; render(); toast(errMsg(e)); }

/* ---- 공개 ---- */
function revealScreen(v){
  const H=S.role==="host", last = v.round>=v.rounds_main-1;
  let h=`<div class="topbar">${H?roundTag(v):meBar(v)}${H?"":roundTag(v)}</div>`;
  if(!H){
    const p=v.players.find(x=>x.id===v.me.id), pk=p.picks[v.round], d=p.deltas[v.round];
    if(d===undefined) h+=`<div class="banner"><span class="na">서든데스 관전 중</span></div>`;
    else if(!pk) h+=`<div class="banner"><span class="na">시간 초과! 0점</span></div>`;
    else h+=`<div class="banner">${pk.ok?`<span class="ok">정답! ${v.sd?"+1":"+"+pk.b}</span>`:`<span class="no">땡! ${v.sd?"0":"−"+pk.b}</span>`}</div>`;
  } else h+=`<div class="q center">판결 공개!</div>`;
  h+=`<div class="pair" style="margin-top:10px">${card(v,0,{})}${card(v,1,{})}</div>`;
  h+=board(v,{delta:true});
  if(H){ h+=`<button class="btn block red" id="next">${last?"다음 (결과 / 서든데스)":"다음 사건"}</button>${script("reveal")}`; }
  else h+=`<div class="sub center">진행자가 다음 사건을 열 때까지 기다려 주세요</div>`;
  return h;
}

/* ---- 최종 결과 ---- */
function finalScreen(v){
  const H=S.role==="host";
  const sm=id=>(v.summary||[]).find(s=>s.id===id)||{};
  const list=v.players.slice().sort((a,b)=>(sm(a.id).rank||9)-(sm(b.id).rank||9));
  let h=`<div class="topbar">${meBar(v)}<span class="tag red">수사 결과</span></div>`;
  const wn=v.winners.map(id=>v.players.find(p=>p.id===id)).filter(Boolean);
  h+=`<div class="center"><div style="font-size:54px">🏆</div><h2>오늘의 행운 수사관</h2>
    <div style="font-family:'Black Han Sans';font-size:clamp(34px,8vw,60px)">${wn.map(p=>`<span style="color:${p.color}">${esc(p.name)}</span>`).join(" · ")}</div></div>`;
  if(!H && v.me){ const s=sm(v.me.id); h+=`<div class="banner">${v.winners.includes(v.me.id)?`<span class="ok">우승! 부스 선생님께 상품을 받으세요</span>`:`<span class="na">나의 순위: ${s.rank}위</span>`}</div>`; }
  h+=`<ul class="board">${list.map(p=>{ const s=sm(p.id);
    return `<li class="${v.winners.includes(p.id)?"win":""}"><span class="rk">${s.rank}</span><span class="dot" style="background:${p.color}"></span>
      <span>${esc(p.name)}<br><span class="sub2">맞힘 ${s.correct}/${v.rounds_main} · 무죄인 사람 지목 ${s.acq}번</span></span><span class="sc">${p.score}</span></li>`; }).join("")}</ul>`;
  if(H) h+=`<button class="btn block red" id="secretBtn">비밀 공개 🔍</button>${script("final")}`;
  else h+=`<div class="sub center">잠깐! 진행자가 비밀을 공개할 거예요…</div>`;
  return h;
}

/* ---- 비밀 공개 + 마무리 ---- */
function secretTexts(v){
  const sm=v.summary||[];
  const acq=sm.reduce((a,s)=>a+(s.acq||0),0), b3=sm.reduce((a,s)=>a+(s.b3||0),0), b3ok=sm.reduce((a,s)=>a+(s.b3ok||0),0);
  const wn=v.winners.map(id=>(v.players.find(p=>p.id===id)||{}).name).filter(Boolean).map(esc).join(", ");
  let t3 = acq>0
    ? `여러분이 “더 무거운 형을 받았을 것”이라고 지목한 사람 중 <b>무죄였던 경우가 모두 ${acq}번</b>이에요. 얼굴만 보고 죄 없는 사람을 범죄자로 찍은 거죠.`
    : `이번엔 피해 갔지만, 오늘 등장한 피고인 ${v.rounds_main*2}명 중 <b>3명은 무죄 판결</b>을 받은 사람이었어요. 얼굴로 판단했다면 누구든 범죄자로 찍힐 수 있었어요.`;
  if(b3) t3 += ` 그리고 ‘100% 확신’(3점)을 건 선택 ${b3}번 중 맞힌 건 <b>${b3ok}번</b>뿐이었어요.`;
  return [
    `오늘 본 얼굴은 모두 <b>컴퓨터가 롬브로소 체크리스트대로 그린 가상 인물</b>이에요. 세상에 없는 사람들이죠.`,
    `판결은 <b>얼굴과 아무 상관 없이 무작위로</b> 붙였어요. 그러니까 1등도 순전히 운! ${wn}님은 실력이 아니라 운으로 뽑힌 <b>‘오늘의 행운 수사관’</b>이에요 🍀`,
    t3
  ];
}
function secretScreen(v){
  const H=S.role==="host", T=secretTexts(v), n = v.phase==="ending" ? 3 : v.secret;
  let h=`<div class="topbar">${meBar(v)}<span class="tag red">비밀 공개</span></div>`;
  for(let i=0;i<n;i++) h+=`<div class="secret"><div class="no">비밀 ${i+1}</div><p>${T[i]}</p></div>`;
  if(v.phase==="ending"){
    h+=`<div class="history"><b>롬브로소는 틀렸습니다.</b> 1913년 영국의 찰스 고링은 수형자 약 3,000명과 일반인의 얼굴과 몸을 비교했어요.
      결과는 ‘범죄자형 얼굴’ 같은 건 없다는 것. 롬브로소의 이론은 지금은 대표적인 사이비 과학으로 꼽혀요.</div>
    <div class="law"><div class="art">대한민국 헌법 제27조 제4항</div>
      <blockquote>“형사피고인은 유죄의 판결이<br>확정될 때까지는 무죄로 추정된다.”</blockquote>
      <p>이게 바로 <b>무죄추정의 원칙</b>이에요. 법정은 얼굴이 아니라 <b>증거</b>로 판단합니다.
      생김새나 첫인상으로 “범인 같다”고 단정하는 순간, 무고한 사람이 범죄자가 될 수 있으니까요.</p></div>`;
    if(H) h+=`<button class="btn block red" id="newGame">다음 판 시작 (같은 코드로 대기실 열기)</button>${script("ending")}`;
    else h+=`<div class="wait">참여해 줘서 고마워요!${v.winners.includes(v.me.id)?"<br>🏆 부스 선생님께 상품을 받아 가세요!":""}</div>`;
  } else if(H){
    h+=`<button class="btn block red" id="secretBtn">${n<3?"비밀 하나 더 🔍":"마무리 화면으로"}</button>${script("secret")}`;
  }
  return h;
}

/* ---- 기타 화면 ---- */
function outScreen(v){
  return `<h1>관상 수사대</h1><div class="panel"><h2>이번 판에 참여하고 있지 않아요</h2>
    <p class="sub">게임이 끝났거나 명단에서 빠졌어요. ${v.phase==="lobby"?"지금 대기실이 열려 있어요!":"진행 중인 판이 끝나면 다시 참여할 수 있어요."}</p>
    <button class="btn block red" id="rejoin" ${v.phase==="lobby"?"":"disabled"}>${esc(S.name)} (${esc(S.sid)})로 다시 참여</button>
    <button class="btn block ghost" id="leave">다른 학번으로 들어가기</button><div class="err" id="oerr"></div></div>`;
}
function bindOut(){
  $("#rejoin").onclick=async()=>{ try{ const r=await api("join",S.code,S.sid,S.name); S.pid=r.pid; S.gameNo=r.gameNo; savePlayer(); S.lastKey=""; poll(true);}catch(e){ $("#oerr").textContent=errMsg(e);} };
  $("#leave").onclick=()=>{ ls.del("lb_player"); location.href=APP_URL+"?code="+S.code; };
}
function goneScreen(){ return `<h1>관상 수사대</h1><div class="panel"><h2>참여 코드가 사라졌어요</h2><p class="sub">진행자에게 새 참여 코드를 물어보세요.</p><button class="btn block" id="goHome">처음으로</button></div>`; }
function bindGone(){ $("#goHome").onclick=()=>{ ls.del("lb_player"); ls.del("lb_host"); location.href=APP_URL; }; }

/* ---- 이벤트 연결 ---- */
function bind(v){
  const H=S.role==="host";
  if(v.phase==="lobby" && H){
    const qr=$("#qr");
    if(qr && typeof QRCode!=="undefined") new QRCode(qr,{text:APP_URL+"?code="+v.code,width:200,height:200,colorDark:"#232220",colorLight:"#f7f4ee"});
    $("#start").onclick=()=>hostAct("startGame");
    $("#plist").onclick=async e=>{ const b=e.target.closest("[data-kick]"); if(!b) return;
      try{ await api("kick",S.code,S.hostKey,b.dataset.kick); poll(true);}catch(err){toast(errMsg(err));} };
    $("#logout").onclick=()=>{ ls.del("lb_host"); location.href=APP_URL; };
  }
  if(v.phase==="pick" && H) $("#forceReveal").onclick=()=>{ S.revealSent[v.gameNo+":"+v.round]=true; hostAct("reveal"); };
  if(v.phase==="pick" && !H){
    const pair=$("#pair");
    if(pair) pair.onclick=e=>{ const c=e.target.closest(".card"); if(!c||S.sel.sent) return;
      S.sel.c=+c.dataset.k; pair.querySelectorAll(".card").forEach(x=>x.classList.toggle("sel",+x.dataset.k===S.sel.c)); playerPickFoot(v); };
    const bets=$("#bets");
    if(bets) bets.onclick=e=>{ const b=e.target.closest(".bet"); if(!b||S.sel.sent) return;
      S.sel.b=+b.dataset.b; bets.querySelectorAll(".bet").forEach(x=>x.classList.toggle("on",+x.dataset.b===S.sel.b)); playerPickFoot(v); };
    playerPickFoot(v);
  }
  if(v.phase==="reveal" && H) $("#next").onclick=()=>hostAct("next");
  const sb=$("#secretBtn"); if(sb) sb.onclick=()=>hostAct("secret");
  const ng=$("#newGame"); if(ng) ng.onclick=()=>hostAct("newGame");
}
function update(v){
  const H=S.role==="host";
  if(v.phase==="lobby" && H) hostLobbyUpdate(v);
  if(v.phase==="lobby" && !H){ const el=$("#pcount"); if(el) el.textContent=`지금 ${v.players.length}명 입장 (최대 ${v.maxPlayers}명)`; }
  if(v.phase==="pick" && H) hostPickUpdate(v);
  const ms=$("#myScore"); if(ms && v.me){ const p=v.players.find(x=>x.id===v.me.id); if(p) ms.textContent=p.score; }
}

/* ================= 입장 화면 ================= */
function savePlayer(){ ls.set("lb_player",{code:S.code,pid:S.pid,sid:S.sid,name:S.name,gameNo:S.gameNo}); }
function entry(){
  document.body.classList.remove("host");
  app.innerHTML=`<span class="tag">사건 기록실 · 1876</span>
  <h1>관상 수사대<br><em>롬브로소의 몽타주</em></h1>
  <p class="sub">얼굴만 보고 형량을 맞힐 수 있을까? 2~4명이 함께 겨루는 수사 게임</p>
  <form class="panel" id="joinForm" autocomplete="off">
    <label class="f" for="jc">참여 코드</label><input class="in code" id="jc" inputmode="numeric" maxlength="4" value="${esc(INIT_CODE)}" placeholder="0000">
    <label class="f" for="js">학번</label><input class="in" id="js" inputmode="numeric" maxlength="8" placeholder="예: 10203">
    <label class="f" for="jn">이름</label><input class="in" id="jn" maxlength="10" placeholder="이름">
    <div class="err" id="jerr"></div>
    <button class="btn block red" type="submit">수사본부 입장</button>
  </form>
  <div class="row"><span class="sub" style="font-size:12px">학번과 이름은 상품 지급 확인용으로만 기록돼요.</span><button class="linkbtn" id="toHost">진행자 화면</button></div>`;
  $("#joinForm").onsubmit=async e=>{
    e.preventDefault();
    const code=$("#jc").value.trim(), sid=$("#js").value.trim(), name=$("#jn").value.trim();
    if(!/^\d{4}$/.test(code)) return $("#jerr").textContent="참여 코드 4자리를 입력하세요.";
    const btn=e.target.querySelector("button"); btn.disabled=true; $("#jerr").textContent="";
    try{
      const r=await api("join",code,sid,name);
      Object.assign(S,{role:"player",code,sid,name,pid:r.pid,gameNo:r.gameNo}); savePlayer();
      app.innerHTML=`<div class="wait">입장 중…</div>`; startPolling();
    }catch(err){ $("#jerr").textContent=errMsg(err); btn.disabled=false; }
  };
  $("#toHost").onclick=hostLogin;
}
function hostLogin(){
  const saved=ls.get("lb_host");
  app.innerHTML=`<span class="tag">진행자 전용</span><h1>진행자 <em>로그인</em></h1>
  <div class="panel">
    <label class="f" for="pin">진행자 비밀번호</label><input class="in" id="pin" type="password" inputmode="numeric">
    <button class="btn block red" id="mk">새 참여 코드 만들기</button>
    ${saved?`<button class="btn block" id="resume">진행 중인 방(코드 ${esc(saved.code)})으로 돌아가기</button>`:""}
    <label class="f" for="rc" style="margin-top:18px">다른 기기에서 만든 코드로 이어서 진행</label>
    <div class="row" style="flex-wrap:nowrap"><input class="in code" id="rc" maxlength="4" inputmode="numeric" placeholder="0000"><button class="btn" id="rcGo">열기</button></div>
    <div class="err" id="herr"></div>
  </div><button class="linkbtn" id="back">← 참가자 입장 화면</button>`;
  const go=(code,hostKey)=>{ Object.assign(S,{role:"host",code,hostKey}); ls.set("lb_host",{code,hostKey}); app.innerHTML=`<div class="wait">불러오는 중…</div>`; startPolling(); };
  $("#mk").onclick=async()=>{ try{ const r=await api("createRoom",$("#pin").value); go(r.code,r.hostKey);}catch(e){ $("#herr").textContent=errMsg(e);} };
  if(saved) $("#resume").onclick=()=>go(saved.code,saved.hostKey);
  $("#rcGo").onclick=async()=>{ try{ const r=await api("hostResume",$("#rc").value.trim(),$("#pin").value); go(r.code,r.hostKey);}catch(e){ $("#herr").textContent=errMsg(e);} };
  $("#back").onclick=entry;
}

/* ================= 시작 ================= */
const savedP=ls.get("lb_player");
if(HOST_MODE){ hostLogin(); }
else if(savedP && savedP.pid && (!INIT_CODE || INIT_CODE===savedP.code)){
  Object.assign(S,{role:"player",code:savedP.code,pid:savedP.pid,sid:savedP.sid,name:savedP.name,gameNo:savedP.gameNo});
  app.innerHTML=`<div class="wait">다시 연결하는 중…</div>`; startPolling();
} else entry();
})();
</script>
</body>
</html>
